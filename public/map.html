<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway and Airport Search Map</title>
    <link rel="stylesheet" href="/leaflet/leaflet.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .toolbar {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .3);
            left: 50px;
            padding: 10px;
            position: absolute;
            top: 20px;
            width: min(430px, calc(100vw - 70px));
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            z-index: 1000;
        }

        .category-controls {
            display: grid;
            gap: 6px;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 8px;
        }

        .category-button {
            background: #eef2f7;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #334155;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 12px;
        }

        .category-button.active {
            background: #0b63ce;
            border-color: #0b63ce;
            color: white;
        }

        .category-button:focus-visible,
        #searchInput:focus {
            outline: 2px solid #3388ff;
            outline-offset: 1px;
        }

        #searchInput {
            border: 1px solid #999;
            border-radius: 5px;
            font-size: 16px;
            height: 40px;
            padding: 0 12px;
            width: min(360px, calc(100vw - 90px));
        }

        #resultStatus {
            color: #4b5563;
            font-size: 13px;
            margin-top: 7px;
            min-height: 16px;
        }

        .flight-tools {
            border-top: 1px solid #e2e8f0;
            margin-top: 10px;
            padding-top: 10px;
        }

        .flight-tools[hidden] {
            display: none;
        }

        .flight-fields {
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr 1fr;
        }

        .flight-field {
            display: grid;
            gap: 4px;
        }

        .flight-field label,
        .route-type legend {
            color: #475569;
            font-size: 12px;
            font-weight: 700;
        }

        .flight-field input {
            border: 1px solid #94a3b8;
            border-radius: 5px;
            font-size: 14px;
            height: 36px;
            min-width: 0;
            padding: 0 9px;
            text-transform: uppercase;
            width: 100%;
        }

        .route-type {
            border: 0;
            display: flex;
            gap: 14px;
            margin-top: 9px;
        }

        .route-type label {
            align-items: center;
            display: flex;
            font-size: 13px;
            gap: 5px;
        }

        .flight-actions {
            display: grid;
            gap: 6px;
            grid-template-columns: repeat(3, 1fr);
            margin-top: 9px;
        }

        .flight-action {
            background: #0b63ce;
            border: 0;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            min-height: 36px;
            padding: 6px;
        }

        .flight-action.secondary {
            background: #475569;
        }

        .flight-action:disabled {
            cursor: wait;
            opacity: .65;
        }

        #flightResults {
            display: grid;
            gap: 6px;
            margin-top: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .flight-result {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            color: #334155;
            font-size: 12px;
            line-height: 1.4;
            padding: 7px;
        }

        .flight-result strong {
            color: #0f172a;
            display: block;
            font-size: 13px;
        }

        .loading::after {
            animation: spin .8s linear infinite;
            border: 2px solid #cbd5e1;
            border-top-color: #0b63ce;
            border-radius: 50%;
            content: "";
            display: inline-block;
            height: 12px;
            margin-left: 7px;
            vertical-align: -2px;
            width: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .category-marker {
            align-items: center;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
            color: #fff;
            display: flex;
            font-size: 20px;
            height: 34px !important;
            justify-content: center;
            line-height: 1;
            width: 34px !important;
        }

        .station-marker {
            background: #138a4a;
        }

        .airport-marker {
            background: #0b63ce;
        }

        .heliport-marker {
            background: #7c3aed;
        }

        .airport-marker span {
            transform: rotate(-12deg);
        }

        .map-popup h3 {
            margin: 0 0 8px;
        }

        .search-row {
            display: grid;
            gap: 8px;
            grid-template-columns: minmax(0, 1fr) auto;
        }

        .search-row #searchInput { width: 100%; }

        .near-me-button,
        .maps-link {
            background: #0b63ce;
            border: 0;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 12px;
            text-decoration: none;
        }

        .near-me-button:disabled { cursor: wait; opacity: .65; }

        .nearby-section {
            border-top: 1px solid #e2e8f0;
            margin-top: 9px;
            padding-top: 9px;
        }

        .nearby-section[hidden] { display: none; }
        .nearby-section h2 { color: #0f172a; font-size: 14px; margin-bottom: 6px; }
        .nearby-list { display: grid; gap: 6px; }

        .nearby-card,
        .nearby-state {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            color: #475569;
            font-size: 11px;
            line-height: 1.35;
            padding: 7px;
        }

        .nearby-card h3 { color: #0f172a; font-size: 12px; margin-bottom: 3px; }
        .nearby-card .distance { color: #0b63ce; font-weight: 700; }
        .nearby-card .coordinates { font-family: monospace; margin: 3px 0 7px; }
        .maps-link { display: inline-block; font-size: 12px; padding: 5px 7px; }
        @media (max-width: 600px) {
            .toolbar {
                left: 10px;
                width: calc(100vw - 20px);
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="category-controls" aria-label="Search category">
            <button
                type="button"
                class="category-button active"
                data-category="railway"
                aria-pressed="true"
            >Railway</button>
            <button
                type="button"
                class="category-button"
                data-category="flight"
                aria-pressed="false"
            >Flight</button>
        </div>
        <div class="search-row">
            <input
                type="search"
                id="searchInput"
                placeholder="Search station name or code"
                autocomplete="off"
                aria-label="Search railway stations"
            >
            <button id="nearMeButton" class="near-me-button" type="button">Near Me</button>
        </div>
        <div id="resultStatus" role="status" aria-live="polite"></div>
        <section id="nearbyResults" class="nearby-section" hidden aria-labelledby="nearbyResultsTitle">
            <h2 id="nearbyResultsTitle">Closest Railway Stations</h2>
            <div id="nearbyList" class="nearby-list"></div>
        </section>
        <section id="flightTools" class="flight-tools" hidden aria-label="Flight route tools">
            <div class="flight-fields">
                <div class="flight-field">
                    <label for="sourceAirport">Source airport</label>
                    <input
                        id="sourceAirport"
                        type="search"
                        list="sourceAirportOptions"
                        placeholder="DEL"
                        maxlength="4"
                        autocomplete="off"
                    >
                    <datalist id="sourceAirportOptions"></datalist>
                </div>
                <div class="flight-field">
                    <label for="destinationAirport">Destination airport</label>
                    <input
                        id="destinationAirport"
                        type="search"
                        list="destinationAirportOptions"
                        placeholder="BOM"
                        maxlength="4"
                        autocomplete="off"
                    >
                    <datalist id="destinationAirportOptions"></datalist>
                </div>
            </div>
            <fieldset class="route-type">
                <legend>Route type</legend>
                <label><input type="radio" name="routeType" value="direct" checked> Direct</label>
                <label><input type="radio" name="routeType" value="one-stop"> One Stop</label>
            </fieldset>
            <div class="flight-actions">
                <button id="routeSearchButton" class="flight-action" type="button">Search routes</button>
                <button id="connectivityButton" class="flight-action secondary" type="button">Connectivity</button>
                <button id="airlineButton" class="flight-action secondary" type="button">Airlines</button>
            </div>
            <div id="flightResults" aria-live="polite"></div>
        </section>
    </div>
    <div id="map"></div>
    <script src="/config.js"></script>
    <script src="/leaflet/leaflet.js"></script>
    <script src="/leaflet/map.js"></script>
    <script src="/leaflet/nearby.js"></script>
</body>
</html>
