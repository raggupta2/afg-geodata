<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Railway Station Map</title>
    <link rel="stylesheet" href="/leaflet/leaflet.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #map { height: 100%; width: 100%; }
        body { font-family: Arial, sans-serif; }
        .toolbar {
            background: rgba(255, 255, 255, .96);
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .22);
            left: 50px;
            padding: 12px;
            position: absolute;
            top: 12px;
            width: min(430px, calc(100vw - 65px));
            z-index: 1000;
        }
        .search-row { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) auto; }
        #searchInput {
            border: 1px solid #999;
            border-radius: 5px;
            font-size: 16px;
            height: 40px;
            padding: 0 12px;
            width: 100%;
        }
        #searchInput:focus { outline: 2px solid #3388ff; outline-offset: 1px; }
        #resultStatus { color: #4b5563; font-size: 13px; margin-top: 7px; min-height: 16px; }
        .near-me-button, .maps-link {
            background: #0b63ce;
            border: 0;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 12px;
            text-decoration: none;
        }
        .near-me-button:disabled { cursor: wait; opacity: .65; }
        .nearby-section { border-top: 1px solid #e2e8f0; margin-top: 9px; padding-top: 9px; }
        .nearby-section[hidden] { display: none; }
        .nearby-section h2 { color: #0f172a; font-size: 14px; margin-bottom: 6px; }
        .nearby-list { display: grid; gap: 6px; }
        .nearby-card, .nearby-state {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            color: #475569;
            font-size: 11px;
            line-height: 1.35;
            padding: 7px;
        }
        .nearby-card h3 { color: #0f172a; font-size: 12px; margin-bottom: 3px; }
        .nearby-card .distance { color: #0b63ce; font-weight: 700; }
        .nearby-card .coordinates { font-family: monospace; margin: 3px 0 7px; }
        .maps-link { display: inline-block; font-size: 12px; padding: 5px 7px; }
        .loading::after {
            animation: spin .8s linear infinite;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            border-top-color: #0b63ce;
            content: "";
            display: inline-block;
            height: 12px;
            margin-left: 7px;
            vertical-align: -2px;
            width: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .category-marker {
            align-items: center;
            background: #138a4a;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
            color: #fff;
            display: flex;
            font-size: 20px;
            height: 34px !important;
            justify-content: center;
            line-height: 1;
            width: 34px !important;
        }
        .map-popup h3 { margin: 0 0 8px; }
        @media (max-width: 600px) { .toolbar { left: 10px; width: calc(100vw - 20px); } }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="search-row">
            <input id="searchInput" type="search" placeholder="Search station name or code" autocomplete="off" aria-label="Search railway stations">
            <button id="nearMeButton" class="near-me-button" type="button">Near Me</button>
        </div>
        <div id="resultStatus" role="status" aria-live="polite"></div>
        <section id="nearbyResults" class="nearby-section" hidden aria-labelledby="nearbyResultsTitle">
            <h2 id="nearbyResultsTitle">Closest Railway Stations</h2>
            <div id="nearbyList" class="nearby-list"></div>
        </section>
    </div>
    <div id="map"></div>
    <script src="/config.js"></script>
    <script src="/leaflet/leaflet.js"></script>
    <script src="/leaflet/map.js"></script>
    <script src="/leaflet/nearby.js"></script>
</body>
</html>
