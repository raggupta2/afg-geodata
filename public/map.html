<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway and Airport Search Map</title>
    <link rel="stylesheet" href="/leaflet/leaflet.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .toolbar {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .3);
            left: 50px;
            padding: 10px;
            position: absolute;
            top: 20px;
            z-index: 1000;
        }

        .category-controls {
            display: grid;
            gap: 6px;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 8px;
        }

        .category-button {
            background: #eef2f7;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #334155;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 12px;
        }

        .category-button.active {
            background: #0b63ce;
            border-color: #0b63ce;
            color: white;
        }

        .category-button:focus-visible,
        #searchInput:focus {
            outline: 2px solid #3388ff;
            outline-offset: 1px;
        }

        #searchInput {
            border: 1px solid #999;
            border-radius: 5px;
            font-size: 16px;
            height: 40px;
            padding: 0 12px;
            width: min(360px, calc(100vw - 90px));
        }

        #resultStatus {
            color: #4b5563;
            font-size: 13px;
            margin-top: 7px;
            min-height: 16px;
        }

        .category-marker {
            align-items: center;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
            color: #fff;
            display: flex;
            font-size: 20px;
            height: 34px !important;
            justify-content: center;
            line-height: 1;
            width: 34px !important;
        }

        .station-marker {
            background: #138a4a;
        }

        .airport-marker {
            background: #0b63ce;
        }

        .airport-marker span {
            transform: rotate(-12deg);
        }

        .map-popup h3 {
            margin: 0 0 8px;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="category-controls" aria-label="Search category">
            <button
                type="button"
                class="category-button active"
                data-category="railway"
                aria-pressed="true"
            >Railway</button>
            <button
                type="button"
                class="category-button"
                data-category="flight"
                aria-pressed="false"
            >Flight</button>
        </div>
        <input
            type="search"
            id="searchInput"
            placeholder="Search station name or code"
            autocomplete="off"
            aria-label="Search railway stations"
        >
        <div id="resultStatus" role="status" aria-live="polite"></div>
    </div>
    <div id="map"></div>
    <script src="/config.js"></script>
    <script src="/leaflet/leaflet.js"></script>
    <script src="/leaflet/map.js"></script>
</body>
</html>
